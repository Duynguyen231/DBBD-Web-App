services:
  postgres:
    image: postgres:16-alpine
    container_name: duongbo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: duongbo
      POSTGRES_PASSWORD: duongbo_secret
      POSTGRES_DB: duongbo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duongbo -d duongbo_db']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: duongbo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@duongbo.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
