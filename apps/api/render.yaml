services:
  - type: web
    name: duongbo-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install && cd apps/api && npx prisma generate && pnpm build
    startCommand: cd apps/api && pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: duongbo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    healthCheckPath: /api/health

databases:
  - name: duongbo-db
    databaseName: duongbo_db
    user: duongbo
    region: singapore
    plan: free
